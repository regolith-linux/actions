name: Setup SSH
description: |
  Setup SSH agent and add server keyscan to the known_hosts file. Each key type
  is scanned on its own, and a scan that cannot connect is retried.

inputs:
  ssh-host:
    description: "Server IP address or FQDN"
    required: true
  ssh-key:
    description: "Server SSH private key"
    required: true

runs:
  using: composite
  steps:
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-key }}

    - name: Generate Known Hosts
      shell: bash
      env:
        SSH_HOST: "${{ inputs.ssh-host }}"
      run: $GITHUB_ACTION_PATH/keyscan.sh
